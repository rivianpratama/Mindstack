<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Mindstack turns eight cognitive-function scores into a structured, honestly-hedged self-reflection report. Not a type, not an assessment."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#212121" />
    <title>Mindstack</title>
    <!-- Inline data-URI favicon: no extra request, no /favicon.ico 404, and no
         asset that could be mistaken for tracking. An "M" on the primary ink. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23343434'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='system-ui,sans-serif' font-size='17' font-weight='650' fill='%23fafafa'%3EM%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/client/styles/app.css" />
  </head>
  <body>
    <main id="app" class="app">
      <noscript>
        <p class="muted">
          Mindstack computes your stack signature in the browser, so it needs
          JavaScript enabled.
        </p>
      </noscript>
    </main>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
